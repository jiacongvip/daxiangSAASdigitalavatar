# HTTP 服务器 - 用于本地开发
server {
    listen 80;
    server_name localhost;
    root /app/public;
    index index.php index.html;

    access_log /dev/stdout;
    error_log /dev/stderr;

    # 隐藏 Nginx 版本号
    server_tokens off;

    # 设置客户端最大上传大小
    client_max_body_size 200M;
    client_body_timeout 600s;
    send_timeout 600s;

    # ThinkPHP 伪静态规则 - 官网前台入口
    location = /website {
        rewrite ^ /admin.php?s=website last;
    }

    # 客户端授权中心公开入口
    location = /clientauth {
        return 404;
    }

    location /clientauth/ {
        if (!-e $request_filename) {
            rewrite ^/clientauth/(.*?)/?$ /adminapi.php/ClientAuthGateway/$1 last;
            break;
        }
    }

    location /website/ {
        if (!-e $request_filename) {
            rewrite ^/website/(.*?)/?$ /admin.php?s=website/$1 last;
            break;
        }
    }

    location /site/ {
        if (!-e $request_filename) {
            rewrite ^/site/(.*?)/?$ /admin.php?s=site/$1 last;
            break;
        }
    }

    location /s/ {
        if (!-e $request_filename) {
            rewrite ^/s/(.*?)/?$ /admin.php?s=s/$1 last;
            break;
        }
    }

    location = /sitemap.xml {
        rewrite ^ /admin.php?s=sitemap.xml last;
    }

    location = /robots.txt {
        rewrite ^ /admin.php?s=robots.txt last;
    }

    # Vue 管理后台 SPA 路由兜底
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # AI数字人用户端 SPA，避免被 ThinkPHP 接到 index.php 后 404
    location = /portal/digitalavatar/index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
    }
    location /portal/digitalavatar/ {
        try_files $uri $uri/ /portal/digitalavatar/index.html;
    }

    # WebSocket 代理 - 直播控制台/客服（Workerman，端口取 config.php 的 kfport）
    location /wss {
        proxy_pass http://127.0.0.1:6228;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ThinkPHP 伪静态规则 - 主入口
    location / {
        if (!-e $request_filename) {
            rewrite ^(.*)$ /index.php?s=$1 last;
            break;
        }
    }

    # 处理 .html 重定向到 .php 路由（必须在 admin.php 规则之前）
    # 处理 admin.php 入口下的所有 .html 后缀路由（通用规则）
    location ~ ^/admin\.php/(.+?)\.html$ {
        return 301 /admin.php/$1;
    }
    
    # 处理根路径下的 Backstage/index.html
    location ~ ^/Backstage/index\.html$ {
        return 301 /admin.php/Backstage/index;
    }

    # ThinkPHP 伪静态规则 - admin.php 入口
    location /admin.php/ {
        if (!-e $request_filename) {
            rewrite ^/admin.php/(.*)$ /admin.php?s=$1 last;
            break;
        }
    }

    # ThinkPHP 伪静态规则 - adminapi.php 入口
    location /adminapi.php/ {
        if (!-e $request_filename) {
            rewrite ^/adminapi.php/(.*)$ /adminapi.php?s=$1 last;
            break;
        }
    }

    # ThinkPHP 伪静态规则 - business.php 入口
    location /business.php/ {
        if (!-e $request_filename) {
            rewrite ^/business.php/(.*)$ /business.php?s=$1 last;
            break;
        }
    }

    # ThinkPHP 伪静态规则 - website.php 入口
    location /website.php/ {
        if (!-e $request_filename) {
            rewrite ^/website.php/(.*)$ /website.php?s=$1 last;
            break;
        }
    }

    # ThinkPHP 伪静态规则 - buyshop.php 入口
    location /buyshop.php/ {
        if (!-e $request_filename) {
            rewrite ^/buyshop.php/(.*)$ /buyshop.php?s=$1 last;
            break;
        }
    }

    # PHP 文件处理 - webdevops/php-nginx 镜像内部处理
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 900s;
        fastcgi_read_timeout 900s;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }

    # 禁止访问敏感目录
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.svn|\.project|LICENSE|README.md) {
        deny all;
    }

    # 收银台前端源码目录（含 src / node_modules / package.json），线上只需要 /cashier/index.html 和 /cashier/static/
    location ^~ /cashier/cashier/ {
        deny all;
    }

    # 运行日志/缓存目录（index.php 入口下 ROOT_PATH=public/，收银台支付日志会写到 public/runtime/log/）
    location ~ ^/runtime/(log|cache|temp|session)/ {
        deny all;
    }

    # 静态资源缓存
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|mp4|webm|ogg|mp3|wav)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}
