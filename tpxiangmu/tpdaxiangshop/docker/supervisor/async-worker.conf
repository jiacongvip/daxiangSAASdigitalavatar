[program:tpdaxiangshop-async-worker]
command=/usr/local/bin/php /app/think async:work --sleep=1 --digitalavatar-interval=3 --digitalavatar-limit=5
directory=/app
user=application
autostart=true
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
